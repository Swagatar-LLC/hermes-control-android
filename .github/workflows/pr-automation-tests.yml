name: PR Automation Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Policy and automation regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run offline regression tests (no API credentials)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
